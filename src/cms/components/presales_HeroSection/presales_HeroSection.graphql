fragment PresalesHeroSection on presales_HeroSection {
    BackgroundImage {
        ...ContentUrl
    }
    BreadcrumbItems {
        __typename
        ... on presales_BreadcrumbItem {
            Label
            Link {
                ...LinkCollection
            }
        }
    }
    SpecialtyBadge
    HeadlineFirst
    HeadlineSecond
    Subheading
    TrustBadges {
        __typename
        ... on presales_TrustBadge {
            Text
        }
    }
}
